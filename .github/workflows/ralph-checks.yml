name: Offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controller:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bash syntax
        shell: bash
        run: |
          bash -n ralph/afk.sh
          bash -n robotwin/setup/install_linux.sh
          bash -n robotwin/setup/run_smoke.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Behavioral and replay tests
        run: python -m unittest discover -s tests
      - name: Setup script syntax
        run: python -m compileall -q src examples robotwin/setup legacy
      - name: Build distribution
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed distribution outside checkout
        run: python tools/check_wheel.py dist/agent_vla-0.1.0-py3-none-any.whl
