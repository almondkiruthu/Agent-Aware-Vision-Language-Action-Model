name: Offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controller:
    name: Offline checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bash syntax
        shell: bash
        run: |
          bash -n ralph/afk.sh
          bash -n robotwin/setup/install_linux.sh
          bash -n robotwin/setup/run_smoke.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Behavioral and replay tests
        run: python -m unittest discover -s tests
      - name: Setup script syntax
        run: python -m compileall -q robotwin/setup legacy
